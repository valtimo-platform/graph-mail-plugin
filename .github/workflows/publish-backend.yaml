name: Build and publish backend

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - v12
      - main

# Least privilege at the workflow level: this job only ever reads the repository. Without an
# explicit block the token inherits whatever the repository default is, which for older
# repositories is read/write on everything.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Using GitHub's API is not supported for push events
  # -------------------------------------------------------------
  #
  # ----------------------------------------------------------------------------------------------
  # Using local .git history
  # ----------------------------------------------------------------------------------------------
  # Event `push`: Compare the preceding remote commit -> to the current commit of the main branch
  # ----------------------------------------------------------------------------------------------
  changed_files:
    runs-on: ubuntu-latest  # windows-latest || macos-latest
    name: Test changed-files
    outputs:
      matrix: ${{ steps.changed-files.outputs.all_changed_files }}
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        with:
          dir_names: 'true'
          dir_names_max_depth: '2'
          dir_names_exclude_current_dir: 'true'
          matrix: 'true'
          files: |
            backend/plugin/**
        uses: tj-actions/changed-files@48d8f15b2aaa3d255ca5af3eba4870f807ce6b3c # v45.0.2
      # NOTE: `since_last_remote_commit: true` is implied by default and falls back to the previous local commit.
      #
      # tj-actions/changed-files is pinned to a commit SHA, not a mutable tag. This action's tags
      # were compromised in March 2025 (CVE-2025-30066) to dump CI secrets into workflow logs —
      # pinning by SHA means a future tag re-point can't silently change what code runs here.

  Build-and-publish:
    if: needs.changed_files.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    needs: changed_files
    strategy:
      matrix:
        value: ${{ fromJSON(needs.changed_files.outputs.matrix) }}
    name: Build and publish

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # CHANGED_DIR (matrix.value / step outputs derived from it) is directory-name content from
      # the changed-files diff — never interpolate it directly into a `run:` script with ${{ }},
      # which substitutes as literal text before the shell parses it (script injection). Always
      # pass it through `env:` and reference it as a quoted shell variable instead.
      - name: Listing changed plugin folders
        run: echo "$CHANGED_DIR"
        env:
          CHANGED_DIR: ${{ matrix.value }}

      - id: gradleTaskAlize
        name: Construct Gradle task name from matrix variant
        run: echo "TASK_NAME=$(echo :$CHANGED_DIR:publishToCentralPortal | sed -e 's/\//:/g')" >> "$GITHUB_OUTPUT"
        env:
          CHANGED_DIR: ${{ matrix.value }}

      - id: gradleTestTaskAlize
        name: Construct Gradle test task name from matrix variant
        run: echo "TASK_NAME=$(echo :$CHANGED_DIR:test | sed -e 's/\//:/g')" >> "$GITHUB_OUTPUT"
        env:
          CHANGED_DIR: ${{ matrix.value }}

      - id: gradleS3TaskAlize
        name: Construct Gradle S3 publish task name from matrix variant
        run: echo "TASK_NAME=$(echo :$CHANGED_DIR:publishAllPublicationsToS3Repository | sed -e 's/\//:/g')" >> "$GITHUB_OUTPUT"
        env:
          CHANGED_DIR: ${{ matrix.value }}

      - name: Test
        run: ./gradlew "$TASK_NAME"
        env:
          TASK_NAME: ${{ steps.gradleTestTaskAlize.outputs.TASK_NAME }}

      - name: Publish to Sonatype (Maven Central)
        run: ./gradlew "$TASK_NAME"
        env:
          TASK_NAME: ${{ steps.gradleTaskAlize.outputs.TASK_NAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SONATYPE_USR: ${{ secrets.SONATYPE_USR }}
          SONATYPE_PSW: ${{ secrets.SONATYPE_PSW }}

      # The AWS credentials are not configured in every fork/environment yet, so the
      # second leg of the dual publish is skipped rather than failed when they are absent.
      - id: s3Credentials
        name: Check whether S3 credentials are available
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_SECRET }}
        run: |
          if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::S3 credentials (VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_ID / _SECRET) are not set — skipping the S3 publish."
          fi

      # Second leg of the dual publish: the same artifacts, same coordinates and version,
      # pushed to the Valtimo AWS S3 bucket (valtimo-releases, eu-central-1).
      - name: Publish to S3 (AWS)
        if: steps.s3Credentials.outputs.available == 'true'
        run: |
          ./gradlew --no-parallel "$TASK_NAME" \
            -PpublishToS3=true \
            -Ps3Bucket=valtimo-releases \
            -Ps3Region=eu-central-1
        env:
          TASK_NAME: ${{ steps.gradleS3TaskAlize.outputs.TASK_NAME }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Gradle's `AwsCredentials` reads these standard AWS env var names.
          AWS_ACCESS_KEY_ID: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VALTIMO_RELEASE_S3_BUCKET_ACCESS_KEY_SECRET }}
