# Local stand-in for a gateway in front of Microsoft that demands a client certificate (mutual TLS).
#   https://localhost:8449 -> the dummy Microsoft Graph and Entra (mockserver)
# Requests without a client certificate signed by certs/ca.pem are refused at HTTP level, the way
# nginx does it by default: a 400 with "No required SSL certificate was sent" or "The SSL
# certificate error".

events {}

http {
    # resolve the upstream per request, so the gateway starts even when mockserver doesn't run
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format mtls '$remote_addr "$request" $status client="$ssl_client_s_dn" verify=$ssl_client_verify';
    access_log /dev/stdout mtls;
    error_log /dev/stderr info;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;
    # Verifies against the CA without sending its name to the client: a JDK client only sends a
    # certificate the server lists the CA of, so with ssl_client_certificate an untrusted
    # certificate would never even arrive here, and that case could not be tried.
    ssl_trusted_certificate /etc/nginx/certs/ca.pem;
    ssl_verify_client       optional_no_ca;
    ssl_verify_depth        2;

    map $ssl_client_verify $client_certificate_error {
        SUCCESS "";
        NONE    "No required SSL certificate was sent";
        default "The SSL certificate error";
    }

    server {
        listen 8449 ssl;
        # Graph Mail uploads attachments of 3 MB and more in chunks of 3.2 MB; nginx allows 1 MB by default
        client_max_body_size 8m;

        location / {
            if ($client_certificate_error) {
                return 400 "<html><head><title>400 $client_certificate_error</title></head><body><center><h1>400 Bad Request</h1></center><center>$client_certificate_error</center><hr><center>nginx</center></body></html>\n";
            }
            set $upstream http://mockserver:1080;
            proxy_pass $upstream;
            proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
            # mockserver hands out its own address as the upload URL of an attachment; rewrite it to
            # the gateway, so the upload goes through the gateway too and passes the upload host check
            proxy_set_header Accept-Encoding "";
            sub_filter       "http://localhost:1080" "https://localhost:8449";
            sub_filter_once  off;
            sub_filter_types application/json;
        }
    }
}
